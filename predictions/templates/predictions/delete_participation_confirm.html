{% extends 'predictions/base.html' %}

{% block content %}
    <h2>Подтверждение удаления</h2>
    <p>Вы уверены, что хотите удалить этого прогнозиста <strong>{{ participation.forecaster }}</strong> из турнира<strong>{{ participation.tournament }}</strong>?</p>

    <form method="post" action="{% url 'predictions:delete-participation' tournament.id participation.id %}">
        {% csrf_token %}
        <button type="submit" style="background-color: #d32f2f; color: white;">Да, удалить</button>
        <a href="{% url 'predictions:tournament-detail' tournament.id %}">Отмена</a>
    </form>
{% endblock %}
