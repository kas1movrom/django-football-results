{% extends 'predictions/base.html' %}

{% block content %}
    <h2>Подтверждение удаления</h2>
    <p>Вы уверены, что хотите удалить этого прогнозиста <strong>{{ forecaster }}</strong>?</p>
    <p>Все связанные прогнозы также будут удалены!</p>

    <form method="post" action="{% url 'predictions:delete-forecaster' forecaster.id %}">
        {% csrf_token %}
        <button type="submit" style="background-color: #d32f2f; color: white;">Да, удалить</button>
        <a href="{% url 'predictions:forecaster-detail' forecaster.id %}">Отмена</a>
    </form>
{% endblock %}
