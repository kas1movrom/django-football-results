{% extends 'predictions/base.html' %}

{% block content %}
    <h2>Подтверждение удаления</h2>
    <p>Вы уверены, что хотите удалить сборную <strong>{{ national_team }}</strong>?</p>

    <form method="post" action="{% url 'predictions:delete-national-team' national_team.id %}">
        {% csrf_token %}
        <button type="submit" style="background-color: #d32f2f; color: white;">Да, удалить</button>
        <a href="{% url 'predictions:national-team-detail' national_team.id %}">Отмена</a>
    </form>
{% endblock %}
