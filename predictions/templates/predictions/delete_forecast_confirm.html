{% extends 'predictions/base.html' %}

{% block content %}
    <h2>Подтверждение удаления</h2>
    <p>Вы уверены, что хотите удалить прогноз:</p>
    <p><strong>{{ forecast }}</strong></p>

    <form method="post" action="{% url 'predictions:delete-forecast' forecast.id %}">
        {% csrf_token %}
        <button type="submit" style="background-color: #d32f2f; color: white;">Да, удалить</button>
        <a href="{% url 'predictions:game-forecast' forecast.game.id forecast.id %}">Отмена</a>
    </form>
{% endblock %}
