{% extends 'predictions/base.html' %}

{% block content %}
    <h2>Редактировать стадию: {{ stage }}</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Сохранить изменения</button>
        <a href="{% url 'index' %}">Отмена</a>
    </form>

    {% if messages %}
        {% for message in messages %}
            <p style="color: {% if message.tags == 'error' %}red{% else %}green{% endif %};">
                {{ message }}
            </p>
        {% endfor %}
    {% endif %}
{% endblock %}
